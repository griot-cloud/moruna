# Moruna workspace root (preamble 6.1). Every member crate is listed under
# crates/; shared dependency versions are pinned exactly in
# [workspace.dependencies] (preamble 6.2) and a bump is an E2 item.
[workspace]
resolver = "3"
members = ["bench", "crates/*"]
# The microkernel is its own workspace on its own toolchain and target (kernel/Cargo.toml).
exclude = ["kernel"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/griot-cloud/moruna"
publish = false

[workspace.dependencies]
# Actual kernel/native prerequisites, integrated from the KD2/KB5/KE2 lanes.
moruna-micro = { path = "crates/moruna-micro", version = "0.6.0" }
moruna-sys = { path = "kernel/sys", version = "=0.1.0" }
moruna-svc = { path = "kernel/svc", version = "=0.1.0" }
moruna-storage-service = { path = "kernel/storage", version = "=0.1.0" }
# Workspace crates (preamble 6.1; the crate graph is preamble 1.3).
moruna-kernel = { path = "crates/moruna-kernel", version = "0.6.0" }
moruna-types = { path = "crates/moruna-types", version = "0.6.0" }
moruna-arena = { path = "crates/moruna-arena", version = "0.6.0" }
moruna-discovery = { path = "crates/moruna-discovery", version = "0.6.0" }
moruna-trace = { path = "crates/moruna-trace", version = "0.6.0" }
moruna-adapters = { path = "crates/moruna-adapters", version = "0.6.0" }
moruna-storage-format = { path = "crates/moruna-storage-format", version = "0.6.0" }
moruna-storage = { path = "crates/moruna-storage", version = "0.6.0" }
moruna-reactor = { path = "crates/moruna-reactor", version = "0.6.0" }
moruna-sources = { path = "crates/moruna-sources", version = "0.6.0" }
moruna-sinks = { path = "crates/moruna-sinks", version = "0.6.0" }
moruna-placement = { path = "crates/moruna-placement", version = "0.6.0" }
moruna-scheduler = { path = "crates/moruna-scheduler", version = "0.6.0" }
moruna-controller = { path = "crates/moruna-controller", version = "0.6.0" }
moruna-runtime = { path = "crates/moruna-runtime", version = "0.6.0" }
moruna-job = { path = "crates/moruna-job", version = "0.6.0" }
moruna-cost = { path = "crates/moruna-cost", version = "0.6.0" }
moruna-plan = { path = "crates/moruna-plan", version = "0.6.0" }
moruna-event = { path = "crates/moruna-event", version = "0.6.0" }
moruna-datafusion = { path = "crates/moruna-datafusion", version = "0.6.0" }
moruna-testkit = { path = "crates/moruna-testkit", version = "0.6.0" }
moruna-vmm = { path = "crates/moruna-vmm", version = "0.6.0" }
moruna-kernels = { path = "crates/moruna-kernels", version = "0.6.0" }
moruna-package = { path = "crates/moruna-package", version = "0.6.0" }
moruna-wasm = { path = "crates/moruna-wasm", version = "0.6.0" }
moruna-sandbox = { path = "crates/moruna-sandbox", version = "0.6.0" }
moruna-image = { path = "crates/moruna-image", version = "0.6.0" }
moruna-plane-linux = { path = "crates/moruna-plane-linux", version = "0.6.0" }
moruna-record = { path = "crates/moruna-record", version = "0.6.0", default-features = false }

# External crates, the preamble 6.2 table, pinned to the latest stable on
# 2026-09-22. Feature lists are the table's "Notes" column; a backend or
# engine feature a component needs beyond these is set in that crate.
arrow = { version = "=59.3.0", default-features = false, features = ["ffi", "ipc", "ipc_compression"] }
# Arrow IPC LZ4_FRAME and ZSTD buffers (07 e.9, 08 e.3, contracts e.8): `moruna-kernel` inflates them
# itself, after checking every declared size; the sink writes them through arrow-ipc.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "frame", "safe-encode", "safe-decode"] }
zstd = { version = "=0.13.3", default-features = false }
# The message arrow-ipc reads after a compressed batch has been inflated: built with the generated
# builders, which need the flatbuffers crate arrow-ipc itself uses. The job document (SDD 22 e.4,
# KA5) is read through the code flatc generates at this version (`tools/flatc/generate.sh`).
flatbuffers = { version = "=25.12.19", default-features = false }
parquet = { version = "=59.3.0", features = ["arrow", "async", "object_store"] }
object_store = { version = "=0.13.2" }
dlpark = { version = "=0.8.0" }
safetensors = { version = "=0.8.0" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "fs", "sync"] }
io-uring = { version = "=0.7.15" }
crossbeam = { version = "=0.8.5" }
cudarc = { version = "=0.19.9", features = ["cuda-12060"] }
pyo3 = { version = "=0.29.2" }
pyo3-arrow = { version = "=0.19.0" }
thiserror = { version = "=2.0.20" }
tracing = { version = "=0.1.44" }
blake3 = { version = "=1.8.7" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
base64 = { version = "=0.23.1" }
libc = { version = "=0.2.189" }
bytes = { version = "=1.12.1" }
getrandom = { version = "=0.4.3" }
hostname = { version = "=0.4.2" }
polars = { version = "=0.55.2" }
datafusion = { version = "=55.1.0" }
# The contract-native engine on both ends of a run (MH 4.5): a governed plan as a source, a
# contract write as a sink. `moruna-datafusion`'s `peql` feature; peQL never depends on Moruna.
peql = { git = "https://github.com/griot-cloud/peQL", rev = "ff69290", version = "=0.4.2" }
# Streams of record batches out of a DataFusion plan; already in the graph through datafusion
# at this version.
futures = { version = "=0.3.34" }
# Each job document task's settings as a FlexBuffers map (SDD 22 e.4, KA5), the version of
# flatbuffers above.
flexbuffers = { version = "=25.12.19" }
tracing-subscriber = { version = "=0.3.23" }
# Added by F8.2: the one-writer, many-reader cell the limits watcher publishes
# into and the sampler reads on every sample. E2 table addition, preamble 6.2.
arc-swap = { version = "=1.9.1" }
# The rust-vmm crates, used by moruna-vmm only (MH 4.8; additions to the preamble 6.2 table,
# 2026-09-26). moruna-vmm also verifies guest image digests with the sha2 pin below.
kvm-ioctls = { version = "=0.25.0" }
kvm-bindings = { version = "=0.14.1", features = ["fam-wrappers"] }
vm-memory = { version = "=0.18.0", features = ["backend-mmap"] }
linux-loader = { version = "=0.14.0", features = ["bzimage", "elf", "pe"] }
vm-superio = { version = "=0.8.2" }
vmm-sys-util = { version = "=0.15.0" }
virtio-queue = { version = "=0.18.0" }
virtio-bindings = { version = "=0.2.7" }
vm-fdt = { version = "=0.3.0" }
acpi_tables = { version = "=0.2.1" }
# Object storage through a socket (MH 4.6, F8.6): an HTTP/1.1 connection over a Unix or vsock
# stream for `object_store`'s S3 client. Every one of them is already in the graph through
# `object_store`'s own HTTP stack at these versions; they are named here so the reactor can
# speak HTTP without a TCP connector (a preamble 6.2 table addition, E2).
hyper = { version = "=1.11.1", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
http = { version = "=1.5.0" }
http-body-util = { version = "=0.1.5" }
socket2 = { version = "=0.6.5" }
# The Vortex file format as a source and a sink (07 SO-O1, 08 SK-O1): the facade crate with its
# file reader and writer only (no wasm, no cloud registry, no memmap). Added under E2 on
# 2026-09-29 by the PM on Brackly's approval; `arrow` ^59.2 and `object_store` ^0.13.2 inside it
# resolve to the pins above, so the graph keeps one arrow.
vortex = { version = "=0.86.1", default-features = false, features = ["files"] }
# The job document's content address (MH 4.1, 13 d.2): `sha256` of the canonical JSON. Already
# in the graph through the engine bridges at this version, so the pin adds no second copy.
sha2 = { version = "=0.11.0" }
# The settings schema each kind declares (SDD 18, decision KD1): JSON Schema 2020-12, derived from
# the type the kind reads its settings with. Already in the graph through `parcel-core` at this
# version (an E2 table addition, preamble 6.2, named in SDD 18 d.5).
schemars = { version = "=1.2.2" }

# Function packages (architecture/function-packages.md, SDD 16 and 17; preamble 6.2 table
# additions, 2026-10-15). wasmtime runs a `.wasm` package with the component model and nothing
# else, at the version parcel's runtime already brings so the graph has one wasmtime; wat
# writes the test components in the text format, at the wasmparser that wasmtime uses; zip is the `.pex`
# archive; landlock and seccompiler confine a `.pex` stage's child on Linux.
wasmtime = { version = "=47.0.4", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }
wat = { version = "=1.252.0" }
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
landlock = { version = "=0.4.7" }
seccompiler = { version = "=0.5.0" }

# OCI images (SDD 19, preamble 6.2 table additions, 2026-10-28): layers are tar, gzip or zstd
# compressed. `flate2` is in the graph already; `zstd` is the one declaration above, at the version
# arrow-ipc uses; `tar` reads the entries, and nothing of it writes to disk, so its `xattr` feature
# stays off.
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10" }
# The microkernel's image filesystem reader (SDD 27), a `no_std` crate of the kernel
# workspace: `moruna-image` writes layer files with its format and reads them back with it.
moruna-imagefs = { path = "kernel/imagefs/fs", version = "=0.1.0" }
# The Arrow IPC check (contracts CT-I13, e.8; SDD 29), a `no_std` crate of the kernel workspace:
# `moruna-kernel` checks every message with it, and the engine on the Moruna kernel checks every
# data-plane record with it.
moruna-ipc-check = { path = "kernel/plane/check", version = "=0.1.0" }
# The data-plane port (SDD 29 d.4), a `no_std` crate of the kernel workspace, and the kernel's ABI
# whose error codes and bounds it speaks in: `moruna-plane-linux` is the port's adapter on Linux.
moruna-plane = { path = "kernel/plane/core", version = "=0.1.0" }
moruna-abi = { path = "kernel/abi", version = "=0.1.0" }
# The engine as a Linux program on the Moruna kernel (SDD 30): `moruna-micro` reaches the
# kernel's own calls through these crates of the kernel workspace, each built for the
# engine's Linux target with its `native` feature.
vsock-protocol = { path = "kernel/drivers/vsock-protocol", version = "=0.1.0" }
linux-protocol = { path = "kernel/linux/protocol", version = "=0.1.0" }
imagefs-protocol = { path = "kernel/imagefs/protocol", version = "=0.1.0" }

# Test binaries statically link arrow and parquet, and a workspace of a dozen
# crates with full debug info in every test binary filled a 90 GB disk while six
# executors built in parallel (2026-09-22). Line tables are what a backtrace and
# coverage need; the rest was bytes nobody read.
[profile.test]
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"
