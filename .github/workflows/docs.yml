# Amoru documentation site (BOARD.md epic E7, feature F7.1). Two jobs:
#   1. build:  tools/docs/check_docs.py (its own self-test first, then the book:
#              em dashes, tabs, links and anchors, SUMMARY.md against the files,
#              a placeholder page with no cites line), then mdBook builds the
#              book and the result is uploaded as an artifact on every run.
#   2. deploy: on a push to main only, publishes that book to GitHub Pages.
# The deploy job is conditional on the repository variable DOCS_PAGES_ENABLED
# because Pages must first be set to "GitHub Actions" by a repository admin, a
# setting this workflow must not and cannot flip. Until an admin enables Pages
# and sets DOCS_PAGES_ENABLED to "true", the job is skipped and the build still
# gates every pull request.
# Every action and tool is pinned to an exact version; a bump is a reviewed change.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: book (check_docs.py, mdBook 0.5.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Documentation checker self-test (tools/docs/check_docs.py)
        run: |
          python3 --version
          tools/docs/check_docs.py --self-test
      - name: Conventions, links and citations over docs/
        run: tools/docs/check_docs.py
      - name: Install mdBook, pinned
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: mdbook@0.5.4
      - name: Build the book
        run: |
          mdbook --version
          mdbook build docs
      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amoru-book
          path: docs/book
          if-no-files-found: error
          retention-days: 14
      - name: Package the book for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: publish to GitHub Pages (main only)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy the artifact the build job packaged
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
