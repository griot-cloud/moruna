name: Publish verified Moruna wheels
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Check whether the publisher runner can start
        required: false
        type: boolean
        default: false
      staging_tag:
        description: Private draft release carrying the Azure artifact
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of release.json from the required Azure build
        required: true
        type: string
      source_commit:
        description: Source commit recorded by Azure DevOps
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Confirm that the publish-only runner starts
        if: inputs.probe
        run: echo Publisher runner is available
      - name: Fetch the retained Azure wheel set from the private release draft
        if: ${{ !inputs.probe }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.staging_tag }}
        run: |
          set -euo pipefail
          mkdir staging
          gh release download --repo "$GITHUB_REPOSITORY" --dir staging \
            --pattern '*.whl' --pattern release.json -- "$TAG"
      - name: Verify the source commit and exact wheel digests
        if: ${{ !inputs.probe }}
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          def digest(path):
              with path.open("rb") as data:
                  return hashlib.file_digest(data, "sha256").hexdigest()

          staging = Path("staging")
          manifest = staging / "release.json"
          assert digest(manifest) == os.environ["MANIFEST_SHA256"]
          record = json.loads(manifest.read_text())
          assert record["commit"] == os.environ["SOURCE_COMMIT"]
          version = record["version"]
          expected = {
              f"moruna-{version}-cp314-{abi}-{target}.whl"
              for abi in ("cp314", "cp314t")
              for target in ("manylinux_2_28_x86_64", "manylinux_2_28_aarch64", "macosx_11_0_arm64")
          }
          actual = {path.name: digest(path) for path in staging.glob("*.whl")}
          assert set(actual) == expected and actual == record["sha256"]
          dist = Path("dist")
          dist.mkdir()
          for filename in sorted(expected):
              shutil.move(staging / filename, dist / filename)
          print(f"Verified {len(actual)} wheels at {record['commit']}")
          PY
      - name: Publish to PyPI with attestations
        if: ${{ !inputs.probe }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.14.0
        with:
          packages-dir: dist
