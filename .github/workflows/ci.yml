name: Publish verified Moruna 0.8.0 wheels
on:
  workflow_dispatch:
    inputs:
      staging_release_id:
        description: ID of the private draft holding the Azure wheel artifact
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of release.json from the approved Azure build
        required: true
        type: string
      source_commit:
        description: Source commit recorded by the approved Azure build
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: [self-hosted, moruna-release-080-f39c783873db]
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download the private staging release and verify its six wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.staging_release_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import urllib.request

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          release_id = int(os.environ["RELEASE_ID"])
          prefix = f"{api}/repos/{repo}/releases"

          def get(url, accept):
              request = urllib.request.Request(url, headers={"Accept": accept})
              request.add_unredirected_header("Authorization", f"Bearer {os.environ['GH_TOKEN']}")
              return urllib.request.urlopen(request, timeout=60)

          def digest(path):
              with path.open("rb") as data:
                  return hashlib.file_digest(data, "sha256").hexdigest()

          with get(f"{prefix}/{release_id}", "application/vnd.github+json") as response:
              release = json.load(response)
          assert release["draft"] and release["tag_name"].startswith("moruna-080-staging-")

          expected = {
              f"moruna-0.8.0-cp314-{abi}-{target}.whl"
              for abi in ("cp314", "cp314t")
              for target in ("manylinux_2_28_x86_64", "manylinux_2_28_aarch64", "macosx_11_0_arm64")
          }
          assets = {asset["name"]: asset["id"] for asset in release["assets"]}
          assert set(assets) == expected | {"release.json"}
          dist = Path("dist")
          dist.mkdir()
          manifest = Path("release.json")
          for name, asset_id in sorted(assets.items()):
              output = manifest if name == manifest.name else dist / name
              with get(f"{prefix}/assets/{asset_id}", "application/octet-stream") as data:
                  with output.open("wb") as file:
                      shutil.copyfileobj(data, file)

          assert digest(manifest) == os.environ["MANIFEST_SHA256"]
          record = json.loads(manifest.read_text())
          assert record["version"] == "0.8.0" and record["commit"] == os.environ["SOURCE_COMMIT"]
          assert {path.name: digest(path) for path in dist.iterdir()} == record["sha256"]
          print(f"Verified {len(expected)} wheels from {record['commit']}.")
          PY
      - name: Sign and upload the verified wheels through Trusted Publishing
        env:
          TWINE_USERNAME: __token__
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          python -m twine check dist/*.whl
          pypi-attestations sign dist/*.whl
          python -m twine upload --attestations --non-interactive --disable-progress-bar dist/*
