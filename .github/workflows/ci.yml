name: Publish Moruna 0.7.1 from local wheels
on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 of the locally verified wheel manifest
        type: string
        required: true
permissions: {}
jobs:
  publish:
    if: github.repository == 'griot-cloud/moruna' && github.ref == 'refs/heads/codex/pypi-publish-0.7.1' && github.actor == 'Brackly'
    runs-on: moruna-pypi-071-15d8b11d25
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Verify the six locally built wheels
        shell: bash
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir dist
          cp /moruna-release/*.whl /moruna-release/SHA256SUMS dist/
          cd dist
          printf '%s  SHA256SUMS\n' "$MANIFEST_SHA256" | sha256sum --strict -c -
          test "$(wc -l < SHA256SUMS)" -eq 6
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 6
          for platform in macosx_11_0_arm64 manylinux_2_28_aarch64 manylinux_2_28_x86_64; do
            for abi in cp314 cp314t; do
              wheel="moruna-0.7.1-cp314-$abi-$platform.whl"
              test -f "$wheel"
              grep -Eq "^[0-9a-f]{64}  ${wheel//./[.]}$" SHA256SUMS
            done
          done
          sha256sum --strict -c SHA256SUMS
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.10.9"
          enable-cache: false
      - name: Attest the locally built wheels
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a
        with:
          paths: dist/*.whl
      - name: Publish to PyPI using GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/*.whl; do
            test -s "$wheel.publish.attestation"
          done
          uv publish --trusted-publishing always --publish-url https://upload.pypi.org/legacy/ \
            --check-url https://pypi.org/simple dist/*.whl
