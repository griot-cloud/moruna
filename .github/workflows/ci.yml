name: Publish verified Moruna 0.8.0 wheels
on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: SHA-256 of release.json from the approved Azure build
        required: true
        type: string
      source_commit:
        description: Source commit recorded by the approved Azure build
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: [self-hosted, moruna-release-080-f39c783873db]
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Verify the mounted Azure release artifact
        env:
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          def digest(path):
              with path.open("rb") as data:
                  return hashlib.file_digest(data, "sha256").hexdigest()

          source = Path("/release-input")
          manifest = source / "release.json"
          assert digest(manifest) == os.environ["MANIFEST_SHA256"]
          record = json.loads(manifest.read_text())
          assert record["version"] == "0.8.0" and record["commit"] == os.environ["SOURCE_COMMIT"]

          expected = {
              f"moruna-0.8.0-cp314-{abi}-{target}.whl"
              for abi in ("cp314", "cp314t")
              for target in ("manylinux_2_28_x86_64", "manylinux_2_28_aarch64", "macosx_11_0_arm64")
          }
          actual = {path.name: digest(path) for path in source.glob("*.whl")}
          assert set(actual) == expected and actual == record["sha256"]
          dist = Path("dist")
          dist.mkdir()
          for name in sorted(expected):
              shutil.copyfile(source / name, dist / name)
          print(f"Verified {len(expected)} wheels from {record['commit']}.")
          PY
      - name: Sign and upload the verified wheels through Trusted Publishing
        env:
          TWINE_USERNAME: __token__
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          python -m twine check dist/*.whl
          pypi-attestations sign dist/*.whl
          python -m twine upload --attestations --non-interactive --disable-progress-bar dist/*
