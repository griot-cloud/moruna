# One workflow, and each part of it answers to a different event. Minutes are paid
# for, so nothing runs twice for the same answer:
#
#   a pull request       the gate: fmt, clippy, tests, and the wheel built, installed
#                        and driven through python/tests. This is the required check
#                        that lets a pull request into main, and the only place the
#                        tests run.
#   a merge to main      the release path, and only when the version changed: the
#                        wheels for every platform we ship, the upload to PyPI, and
#                        then the tag. No tests, because the tree that merged is the
#                        tree that was just tested: protection requires a branch to be
#                        up to date with main and keeps history linear. The
#                        documentation site is published too, and only when docs/
#                        changed; the pull request already built it with warnings as
#                        errors.
#   weekly and on demand the checks that answer to the outside world rather than to a
#                        commit, and the ones that need a real cgroup ceiling.
#
# Nobody creates a tag. A version bump merged to main is the release, the tag is made
# here once PyPI has accepted the upload, and a tag therefore always marks something
# that shipped. Pushing one by hand triggers nothing at all.
#
# What is deliberately NOT here:
#   coverage      tools/quality/check.sh enforces 90% per crate in the hook,
#                 before every commit. Running cargo-llvm-cov again in CI
#                 doubles the build for a number we already have.
#   cargo-deny    licences and advisories change with the world, not with a
#                 commit, so they run weekly and on demand, below.
#   the container the cgroup ceiling and MinIO matter at a wave gate, not on
#                 every push: a full rebuild inside a container is the most
#                 expensive thing here. Run it from the Actions tab, or let
#                 the weekly run do it, before closing a gate that cites it
#                 (preamble 6.6: DS-T9 and every later container-gated test).
name: ci

on:
  pull_request:
    # v1 is the 1.0 line (BOARD EK): its pull requests are checked like main's, and
    # nothing on it releases, because the release path below runs only on a push to main.
    branches: [main, v1]
  # A merge to main, which is the only way a commit reaches it: the branch is
  # protected and takes pull requests. This is the release path's trigger, and it
  # does nothing unless the version in Cargo.toml has no tag yet.
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      container:
        description: "Also run the container and MinIO stage"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request run is waste; a superseded release is a half published
  # one, so only the former is cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: build, test, lint
    # Not on the merge: this job's whole output is the required check on the pull
    # request, and running it again on the other side of the merge buys a second
    # opinion on the same commit for twice the minutes.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # One interpreter: CPython 3.14 free-threaded, which is what S8 is
          # about. The GIL path is the same interpreter under PYTHON_GIL=1.
          python-version: "3.14t"
      - name: Format, lints and the documentation checker
        run: |
          cargo fmt --all -- --check
          tools/lint/no_tier_wildcard.sh
          tools/docs/check_docs.py
      - name: The documentation site builds, warnings as errors
        run: |
          python -m pip install --quiet -r docs/requirements.txt
          sphinx-build -W --keep-going -q -b html docs docs/_build/html
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: The image kind, for real (SDD 19 k)
        # An image's command runs in its own namespaces, under Landlock and seccomp, in a cgroup
        # Moruna made: that needs root and a cgroup v2 directory with `memory` and `cpu` handed to
        # its children, which the runner has once it is asked. The tests are `--ignored` for a
        # machine with neither; here they run, as root, with the directory.
        run: |
          bin="$(cargo test -p moruna-image --test image_kind --locked --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "image_kind") | .executable')"
          test -x "$bin"
          sudo mkdir -p /sys/fs/cgroup/moruna-ci
          echo "+memory +cpu" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          echo "+memory +cpu" | sudo tee /sys/fs/cgroup/moruna-ci/cgroup.subtree_control
          sudo env MORUNA_SANDBOX_CGROUP=/sys/fs/cgroup/moruna-ci "$bin" --ignored --test-threads=1
      - name: peQL with its Iceberg binding compiled in (moruna-datafusion's peql-iceberg)
        # A host that embeds peQL with `iceberg` unifies that feature into Moruna's build, so the
        # governed ends must compile and pass with it on, not only in the default graph.
        run: |
          cargo clippy -p moruna-datafusion -p moruna-runtime --all-targets --locked \
            --features moruna-datafusion/peql-iceberg,moruna-runtime/peql -- -D warnings
          cargo test -p moruna-datafusion --locked --features moruna-datafusion/peql-iceberg
      - name: CT-T12 boundary, moruna-kernel has no runtime dependency
        run: |
          cargo tree -p moruna-kernel > kernel-tree.txt
          if grep -E -i '\b(tokio|cudarc|pyo3|parquet|object_store)\b' kernel-tree.txt; then
            echo "moruna-kernel must not depend on tokio, cudarc, pyo3, parquet or object_store (01 section a, CT-T12)" >&2
            exit 1
          fi
      - name: The Python kernels
        run: |
          python -c 'import sys, sysconfig; print(sys.version); print("free-threaded:", bool(sysconfig.get_config_var("Py_GIL_DISABLED")), "gil now:", sys._is_gil_enabled())'
          PYTHON_GIL=1 python -c 'import sys; assert sys._is_gil_enabled()'
          # pyarrow is not optional: python/moruna/__init__.py refuses to import
          # without it, because it is the format the runtime hands a kernel and takes
          # back with no copy. It publishes cp314t manylinux wheels, so --only-binary
          # is satisfiable; if that ever stops being true this step fails loudly, which
          # is what we want, because the Python surface would not work on Linux.
          # pyyaml is the `package` extra's (pip is already here): `moruna package` reads
          # function.yaml (SDD 16 e.3), and python/tests packages projects.
          python -m pip install --quiet --only-binary=:all: numpy pytest pyarrow maturin pyyaml
          cd bench/python && python -m pytest -q
      - name: The wheel builds, installs and runs on Linux
        # The check that matters for a release: not "does the source tree import", which
        # cannot work without the compiled extension, but "does the artefact we would
        # publish work on the platform we publish it for". python/tests drives a real
        # pass through the installed wheel, so this is also where a Linux-only runtime
        # defect would surface (2026-09-23; before this, nothing proved either).
        run: |
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist moruna
          python -c 'import moruna; print("moruna", moruna.__version__)'
          # From outside the tree, always. pytest puts the test's own root on sys.path,
          # so running python/tests in place lets python/moruna (the source package,
          # with no compiled _core) shadow the wheel that was just installed, and the
          # suite then tests something that cannot work while reporting on something
          # that can.
          cp -R python/tests /tmp/moruna-tests
          cd /tmp && python -m pytest -q /tmp/moruna-tests

  # The microkernel (SDD 20 k, SDD 23 k), on a pull request that touches kernel/ or this
  # file, and never on a push: kernel/ is its own Cargo workspace on a pinned nightly,
  # built with plain cargo for x86_64-unknown-none and booted under QEMU with KVM when
  # the runner has it (TCG otherwise), on one, two and four CPUs. Each boot's serial line
  # must carry every line the boot description expects, every CPU online and having run
  # a process, no failure and no panic, and QEMU must exit with the kernel's success
  # status. A commit that changes kernel/examples/ must touch no file of the kernel.
  kernel:
    name: the microkernel builds and boots (KB1)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      # Asterinas pins QEMU 10.2.1 for OSTD 0.19.0 (tools/dev_env/nix/packages/qemu.nix
      # and osdk/tools/docker/Dockerfile, tag v0.19.0): Ubuntu 24.04's 8.2 has known
      # problems with it. Built from the release tarball, checked by its digest, cached.
      QEMU_VERSION: "10.2.1"
      QEMU_SHA256: a3717477d8e2c84d630bfffbc20f6cd3293eb45aa1e6dac6d0cc27689991c9e1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        name: Did this pull request touch kernel/?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE...HEAD" -- kernel/ .github/workflows/ci.yml; then
            echo "kernel/ is unchanged, so its build and boot stand"
            echo "kernel=false" >> "$GITHUB_OUTPUT"
          else
            echo "kernel=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the kernel's pinned toolchain (kernel/rust-toolchain.toml)
        if: steps.changed.outputs.kernel == 'true'
        working-directory: kernel
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changed.outputs.kernel == 'true'
        with:
          workspaces: kernel
      - id: qemu-cache
        if: steps.changed.outputs.kernel == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/qemu
          key: qemu-${{ env.QEMU_VERSION }}-x86_64-softmmu-ubuntu-24.04-v1
      - name: Build QEMU ${{ env.QEMU_VERSION }}
        if: steps.changed.outputs.kernel == 'true' && steps.qemu-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build pkg-config libglib2.0-dev python3-venv flex bison
          curl -fsSL -o qemu.tar.xz "https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz"
          echo "$QEMU_SHA256  qemu.tar.xz" | sha256sum -c -
          mkdir qemu-src && tar xf qemu.tar.xz --strip-components=1 -C qemu-src
          cd qemu-src
          ./configure --prefix=/opt/qemu --target-list=x86_64-softmmu \
            --without-default-features --enable-kvm --enable-tcg --disable-docs --disable-werror
          make -j"$(nproc)"
          sudo make install
      - name: QEMU on the path, and KVM for this user when the runner has it
        if: steps.changed.outputs.kernel == 'true'
        run: |
          echo /opt/qemu/bin >> "$GITHUB_PATH"
          /opt/qemu/bin/qemu-system-x86_64 --version
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no /dev/kvm: the boot runs under TCG"
      - name: Format, and the host tests of the ABI, the loaders, the handle table, the SDK and the image tool
        if: steps.changed.outputs.kernel == 'true'
        working-directory: kernel
        run: |
          cargo fmt --all -- --check
          host="$(rustc -vV | sed -n 's/^host: //p')"
          packages=(-p moruna-abi -p moruna-loader -p moruna-handles -p moruna-svc -p moruna-image)
          cargo clippy --locked --target "$host" --all-targets "${packages[@]}" --features moruna-abi/manifest -- -D warnings
          cargo test --locked --target "$host" "${packages[@]}" --features moruna-abi/manifest
      - name: Examples touch no file of the kernel (SV-T15)
        if: steps.changed.outputs.kernel == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: kernel/tools/check-examples.sh "$BASE" HEAD
      - name: Build the kernel, the programs and the boot image
        if: steps.changed.outputs.kernel == 'true'
        run: kernel/tools/build.sh "$RUNNER_TEMP/boot"
      - name: Boot under QEMU on one, two and four CPUs and judge each serial line
        if: steps.changed.outputs.kernel == 'true'
        run: |
          fail=0
          for cpus in 1 2 4; do
            echo "::group::boot on $cpus CPUs"
            set +e
            kernel/tools/boot.sh "$RUNNER_TEMP/boot" 600 "$cpus" | tee "$RUNNER_TEMP/serial-$cpus.log"
            status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"
            echo "verdict of the boot on $cpus CPUs:"
            kernel/tools/check-boot.sh "$RUNNER_TEMP/serial-$cpus.log" "$status" "$RUNNER_TEMP/boot/expect" "$cpus" || fail=1
          done
          exit "$fail"
      - name: Clippy for x86_64-unknown-none (the kernel, and every userland crate)
        if: steps.changed.outputs.kernel == 'true'
        working-directory: kernel
        env:
          RUSTFLAGS: -C relocation-model=static -C relro-level=off -C force-unwind-tables=yes --check-cfg cfg(ktest) -C no-redzone=y
        run: |
          build_std=(-Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem)
          cargo clippy --release --locked --target x86_64-unknown-none "${build_std[@]}" \
            -p moruna-microkernel-boot -- -D warnings
          cargo clippy --release --locked --target x86_64-unknown-none "${build_std[@]}" --workspace \
            --exclude moruna-microkernel --exclude moruna-microkernel-boot --exclude moruna-image -- -D warnings
      - name: Licences of the kernel workspace (MPL-2.0 for OSTD, DECISIONS.md MK1)
        if: steps.changed.outputs.kernel == 'true'
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@0.20.2
      - if: steps.changed.outputs.kernel == 'true'
        run: cargo deny --manifest-path kernel/Cargo.toml check licenses bans sources
      - if: always() && steps.changed.outputs.kernel == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-serial-logs
          path: |
            ${{ runner.temp }}/serial-*.log
            ${{ runner.temp }}/boot/manifest
            ${{ runner.temp }}/boot/expect
          if-no-files-found: warn
          retention-days: 14

  # Weekly and on demand: the checks that answer to the outside world rather
  # than to a commit, and the ones that need a real cgroup ceiling.
  slow:
    name: supply chain, container
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.container)
    needs: ci
    runs-on: ubuntu-latest
    env:
      MORUNA_S3_ENDPOINT: http://127.0.0.1:9000
      MORUNA_S3_BUCKET: moruna-ci
      AWS_ACCESS_KEY_ID: moruna
      AWS_SECRET_ACCESS_KEY: moruna-ci-secret
      AWS_REGION: us-east-1
      AWS_ALLOW_HTTP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Advisories, licences, bans and sources
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories licenses bans sources
      - name: MinIO for the object-store paths
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 30); do
            curl -sf "$MORUNA_S3_ENDPOINT/minio/health/live" >/dev/null && break
            sleep 1
          done
          docker run --rm --network host \
            -e MC_HOST_ci="http://$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY@127.0.0.1:9000" \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z mb "ci/$MORUNA_S3_BUCKET"
      - name: Tests under a real cgroup ceiling, ignored ones included
        run: |
          docker run --rm --network host \
            --memory=2g --memory-swap=2g --cpus=1.5 \
            -v "$PWD":/w -w /w \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -e MORUNA_S3_ENDPOINT -e MORUNA_S3_BUCKET -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY -e AWS_REGION -e AWS_ALLOW_HTTP \
            rust:1.98.1-slim \
            sh -ec 'cat /sys/fs/cgroup/memory.max; cat /sys/fs/cgroup/cpu.max; cargo test --workspace --locked -- --include-ignored'

  # The rule every publish below follows: a commit on main is published (to PyPI, as a tag,
  # or as the documentation site) only when it is the merge of a pull request whose
  # `build, test, lint` passed. Tests do not run again on the merge; this job checks that they
  # ran, and passed, on the change that was merged, and the branch's protection requires a
  # pull request to be up to date with main before it merges, so what was tested is what
  # landed. A commit that reached main any other way (an administrator's push past the
  # protection, as E8's did on 2026-09-27, and 0.2.0 shipped from it) publishes nothing.
  tested:
    name: the merged change passed its checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == env.SHA)][0].number // empty')"
          if [ -z "$pr" ]; then
            echo "::error::$SHA is not the merge of a pull request into main, so nothing checked it; it is not published"
            exit 1
          fi
          head="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
          conclusion="$(gh api "repos/$REPO/commits/$head/check-runs?check_name=build,%20test,%20lint" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion // empty')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::pull request #$pr's build, test, lint on $head is '${conclusion:-absent}', so $SHA is not published"
            exit 1
          fi
          echo "$SHA is the merge of pull request #$pr, whose build, test, lint passed on $head"

  # The documentation site, on a merge to main that changed docs/. Built here rather than
  # carried over from the pull request, because an artefact from another run cannot be
  # deployed; the pull request's build is the one that failed on a warning. Two jobs,
  # because only the second may write to Pages.
  docs:
    name: build the documentation site
    needs: tested
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        name: Did this merge change docs/?
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A first push to the branch has no "before"; publish then.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- docs/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/ is unchanged, so the published site stands"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changed.outputs.changed == 'true'
        with:
          python-version: "3.14t"
      - name: Build the site
        if: steps.changed.outputs.changed == 'true'
        run: |
          python -m pip install --quiet -r docs/requirements.txt
          sphinx-build -W --keep-going -q -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.changed.outputs.changed == 'true'
        with:
          path: docs/_build/html

  pages:
    name: publish the documentation site
    needs: docs
    if: needs.docs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The release path: a merge to main, and only when the version changed. Three jobs
  # because each needs something the others must not have: `version` reads the tree and
  # nothing else, `wheels` runs on every platform we ship, and `release` alone holds the
  # tokens that can write to PyPI and to this repository.
  version:
    name: a version to release
    needs: tested
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, because their absence is the question this job answers.
          fetch-depth: 0
      - id: check
        name: Is the version in Cargo.toml already released?
        run: |
          version="$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "no version found under [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is tagged already, so this merge is not a release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag, so this merge releases it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    name: build the wheels
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # A named image, not ubuntu-latest: 0.5.7's wheels were built on ubuntu-26.04 when
        # ubuntu-latest moved, maturin found no manylinux tag for its glibc, and PyPI refused them.
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # Both builds (PY-I7), each named by its own path: the free-threaded install also
      # carries a `python3.14`, so a bare name finds 3.14t twice (0.2.4 shipped only 3.14t).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: standard
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: freethreaded
        with:
          python-version: "3.14t"
      - name: Build the wheels
        env:
          STANDARD: ${{ steps.standard.outputs.python-path }}
          FREETHREADED: ${{ steps.freethreaded.outputs.python-path }}
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist --interpreter "$STANDARD" "$FREETHREADED"
          ls dist/*-cp314-cp314-* dist/*-cp314-cp314t-*
          if ls dist/*-linux_*.whl 2>/dev/null; then
            echo "a wheel with no manylinux tag cannot be published to PyPI" >&2
            exit 1
          fi
          ls -la dist
      - name: The wheel installs and runs before it is published
        # A wheel that has never been imported is not a release candidate. The tests
        # themselves ran on the pull request; this is the artefact, on this platform, in
        # both builds.
        env:
          STANDARD: ${{ steps.standard.outputs.python-path }}
          FREETHREADED: ${{ steps.freethreaded.outputs.python-path }}
        run: |
          for py in "$STANDARD" "$FREETHREADED"; do
            "$py" -m pip install --only-binary=:all: pyarrow
            "$py" -m pip install --no-index --find-links dist moruna
            "$py" -c "import moruna; print(moruna.__version__); print(moruna.inspect_host()['limits'])"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  # The microVM (MH 4.8.7): the monitor for both Linux targets, and the guest image built
  # from the recipe in guest/ and published as an OCI artefact by digest. Each runner builds
  # its own architecture natively, because a KVM guest runs the host's architecture and the
  # image build runs the kernel's and CPython's own build systems. Everything a host
  # downloads carries a .sha256, a keyless cosign signature and an SBOM.
  vmm:
    name: moruna-vmm and the guest image (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GUEST_REPO: ghcr.io/${{ github.repository_owner }}/moruna-guest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.sh takes SOURCE_DATE_EPOCH from the last commit.
          fetch-depth: 1
      - run: rustup toolchain install
      # Both builds, each named by its own path, as in `wheels`: the guest carries the
      # free-threaded one for the engine and the standard one for the sandbox (SDD 17 f.10),
      # and the free-threaded install also carries a `python3.14`, so a bare name built the
      # free-threaded wheel twice and 0.5.0 did not publish (2026-10-16).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: standard
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: freethreaded
        with:
          python-version: "3.14t"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: The monitor
        run: |
          cargo build --release --locked -p moruna-vmm
          mkdir -p dist
          cp target/release/moruna-vmm "dist/moruna-vmm-${{ matrix.target }}"
          ./target/release/moruna-vmm --version
      - name: The guest image, built twice to prove it reproduces
        env:
          STANDARD: ${{ steps.standard.outputs.python-path }}
          FREETHREADED: ${{ steps.freethreaded.outputs.python-path }}
        run: |
          "$FREETHREADED" -m pip install --upgrade pip maturin
          # pyproject.toml's features: the guest runs governed plans and contract writes. The
          # free-threaded wheel for the engine, the standard one for the sandbox a .pex stage
          # runs in (SDD 17 f.10); each must exist before the image is built.
          "$FREETHREADED" -m maturin build --release --out wheel --interpreter "$FREETHREADED" "$STANDARD"
          ls wheel/moruna-*-cp314-cp314t-*.whl wheel/moruna-*-cp314-cp314-*.whl
          guest/build.sh wheel/moruna-*-cp314-cp314t-*.whl wheel/moruna-*-cp314-cp314-*.whl build-a
          guest/build.sh wheel/moruna-*-cp314-cp314t-*.whl wheel/moruna-*-cp314-cp314-*.whl build-b
          if [ "$(cat build-a/digest)" != "$(cat build-b/digest)" ]; then
            echo "the guest image does not reproduce: $(cat build-a/digest) vs $(cat build-b/digest)" >&2
            # Which layer, and what in the root differs. mtimes are left out: mkfs.erofs -T
            # clamps them, so they never reach the image.
            find build-a build-b -maxdepth 1 -type f -exec sha256sum {} + | sort -k2 >&2
            sudo diff -rq --no-dereference build-a/rootfs build-b/rootfs >&2 || true
            list() { (cd "$1" && sudo find . -printf '%p %M %U:%G %s %n %l\n' | LC_ALL=C sort); }
            diff <(list build-a/rootfs) <(list build-b/rootfs) >&2 || true
            exit 1
          fi
          echo "GUEST_DIGEST=$(cat build-a/digest)" >> "$GITHUB_ENV"
      - name: Keep both guest builds when they differ, to diff offline
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-builds-${{ matrix.arch }}
          path: |
            build-*/Image
            build-*/vmlinux
            build-*/initramfs.cpio.gz
            build-*/rootfs.erofs
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish the guest image by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="$GUEST_REPO:$VERSION-${{ matrix.arch }}"
          oras cp --from-oci-layout "build-a/oci@$GUEST_DIGEST" "$ref"
          echo "$GUEST_REPO@$GUEST_DIGEST" > "dist/moruna-guest-${{ matrix.arch }}.ref"
      - name: SBOMs
        run: |
          syft scan "file:dist/moruna-vmm-${{ matrix.target }}" -o spdx-json="dist/moruna-vmm-${{ matrix.target }}.spdx.json"
          syft scan dir:. --select-catalogers rust -o spdx-json="dist/moruna-vmm-${{ matrix.target }}.cargo.spdx.json"
          syft scan "dir:build-a/rootfs" -o spdx-json="dist/moruna-guest-${{ matrix.arch }}.spdx.json"
          oras attach --artifact-type application/spdx+json \
            "$GUEST_REPO@$GUEST_DIGEST" "dist/moruna-guest-${{ matrix.arch }}.spdx.json"
      - name: Checksums and keyless signatures
        run: |
          cosign sign --yes "$GUEST_REPO@$GUEST_DIGEST"
          cd dist
          for f in moruna-vmm-${{ matrix.target }} *.spdx.json *.ref; do
            sha256sum "$f" > "$f.sha256"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -la
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vmm-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  release:
    name: publish to PyPI and tag
    needs: [version, wheels, vmm]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The OpenID Connect token PyPI's trusted publishing wants, so there is no token
      # in this repository and nothing to leak, and write access for the tag below.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Every wheel that was built is here
        run: ls -la dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.14.0
        with:
          packages-dir: dist
          skip-existing: true
      - name: Tag what was published
        # After the upload and not before it. A tag made first is a tag that survives a
        # failed publish, which is how v0.1.1 and v0.1.2 came to name releases that do
        # not exist and had to be deleted by hand (2026-09-23). Made here, a tag always
        # marks something that shipped.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="$(awk -v v="## $VERSION" '$0 == v {f=1; next} f && /^## /{exit} f' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            notes="See CHANGELOG.md"
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$notes"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vmm-*
          merge-multiple: true
          path: vmm
      - name: Attach the monitor, the guest image references, checksums, signatures and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$VERSION" vmm/*
