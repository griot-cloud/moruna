# A managed agent is kept for up to seven days, so a job finds its earlier build under target/
# and kernel/target/: the checkout leaves them, and every other untracked file an earlier run
# left goes. They stay on the job disk (/mnt, the VM's local SSD). Bound onto the pool's 128 GB
# Standard SSD data disk instead, a cold Rust gate ran past 90 minutes, against about 45 on the
# job disk (2026-11-15). Every job of this pipeline shares the one checkout, so when the job disk
# has under 20 GB free the builds are dropped and the job starts cold.
parameters:
  - name: fetchDepth
    type: number
    default: 1
steps:
  - checkout: self
    fetchDepth: ${{ parameters.fetchDepth }}
    clean: false
  - bash: |
      set -euo pipefail
      # An earlier version of this template bound target/ onto the data disk.
      if mountpoint -q target; then sudo umount target; fi
      git clean -ffdxq -e /target/ -e /kernel/target/
      free_gb=$(df -BG --output=avail . | tail -1 | tr -dc 0-9)
      if [ "$free_gb" -lt 20 ]; then
        echo "the job disk has ${free_gb} GB free: the earlier build goes"
        rm -rf target kernel/target
      fi
      df -h . | tail -1
    displayName: An earlier run's untracked files go; target/ stays while the job disk has room
