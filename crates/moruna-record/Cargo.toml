[package]
name = "moruna-record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna records: the fixed binary record layout and the multi-producer ring that carries it"

[dependencies]
# Item 5.0: only when built as a dependency of Rust's std on Moruna (feature `rustc-dep-of-std`).
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

[features]
default = ["std"]
# Adds the `std::error::Error` impls; the crate is `no_std` with `alloc` without it.
std = []
# Item 5.0: built as a dependency of Rust's std for `target_os = "moruna"`
# (kernel/vendor/rust-std), whose `core` and `alloc` are the ones being built beside it: std's
# stdout and stderr are lines of a task's log, which are this crate's records.
rustc-dep-of-std = ["dep:core", "dep:alloc"]
