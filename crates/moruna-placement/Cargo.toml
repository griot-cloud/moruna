[package]
name = "moruna-placement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna placement engine"

[dependencies]
moruna-kernel = { workspace = true }
arrow = { workspace = true }
crossbeam = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
hostname = { workspace = true }
cudarc = { workspace = true, optional = true }

[dev-dependencies]
# The fakes of contracts d.15; every PL test is written against them (k).
moruna-testkit = { workspace = true }

[features]
default = []
cuda = ["dep:cudarc"]
rdma = []

# The eviction order's benchmark (09 f.18, PL-B1): known-future against an LRU comparator that
# lives in the bench alone. `cargo bench -p moruna-placement --bench known_future`.
[[bench]]
name = "known_future"
harness = false
