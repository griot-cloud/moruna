[package]
name = "moruna-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna test fakes for every contracts interface"

[dependencies]
moruna-kernel = { workspace = true }
# Compressed IPC streams, built by hand to carry the lengths a test wants them to lie about
# (`ipc::crafted`).
lz4_flex = { workspace = true }
zstd = { workspace = true }
flatbuffers = { workspace = true }

# The data plane's boot fixtures (`plane-fixture`, SDD 29 k) build their batches with
# arrow, the same arrow `moruna-kernel` re-exports.
arrow = { workspace = true }
moruna-ipc-check = { workspace = true }

[features]
default = []

# The data plane's boot fixtures (SDD 29 k), written by kernel/tools/build.sh.
[[bin]]
name = "plane-fixture"
path = "src/bin/plane-fixture.rs"
test = false

# KD2's boot fixture (SDD 30 k): the rows the engine on the kernel reads.
[[bin]]
name = "kd2-fixture"
path = "src/bin/kd2-fixture.rs"
test = false
