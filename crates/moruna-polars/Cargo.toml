[package]
name = "moruna-polars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna Polars bridge"

[dependencies]
moruna-kernel = { workspace = true }
polars = { workspace = true, optional = true }
# Polars 0.55 holds its data in `polars-arrow`, not in arrow-rs, and does not re-export it, so
# the only way from a `Series` to the contract's `RecordBatch` is the Arrow C Data Interface,
# whose two halves live in `polars-arrow` and in the `arrow` that `moruna-kernel` re-exports.
# Pinned to the version `polars` itself depends on. E2: this crate is not in the preamble 6.2
# table and is not named in 05-adapters d.2; reported.
polars-arrow = { version = "=0.55.2", optional = true }

[features]
default = []
polars = ["dep:polars", "dep:polars-arrow"]

[[test]]
name = "ad_t9_polars_bridge"
path = "tests/ad_t9_polars_bridge.rs"
required-features = ["polars"]

[[test]]
name = "frame_kernel"
path = "tests/frame_kernel.rs"
required-features = ["polars"]
