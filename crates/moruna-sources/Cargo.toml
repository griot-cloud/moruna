[package]
name = "moruna-sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna sources"

[dependencies]
moruna-kernel = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
# The safetensors header is parsed here (src/tensor/safetensors.rs), not with the `safetensors`
# crate: `SafeTensors::read_metadata` refuses a buffer that is not the whole file, and a source
# must not read a whole model file to plan it.
serde_json = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
pyo3 = { workspace = true, optional = true }
# The Arrow C Data Interface import of a `pyarrow.RecordBatch` (src/py_iter.rs). Taking an
# `FFI_ArrowArray` out of a PyCapsule by hand needs `unsafe`, which 07 section l does not
# allow this crate. Reported as an E2 note: the preamble 6.2 row for `pyo3-arrow` lists
# components 5 and 12, not 7.
pyo3-arrow = { workspace = true, optional = true }

[dev-dependencies]
moruna-testkit = { workspace = true }

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-arrow"]
