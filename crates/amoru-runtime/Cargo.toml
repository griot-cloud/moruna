[package]
name = "amoru-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Amoru runtime facade"

[dependencies]
amoru-kernel = { workspace = true }
amoru-arena = { workspace = true }
amoru-discovery = { workspace = true }
amoru-trace = { workspace = true }
amoru-adapters = { workspace = true }
amoru-reactor = { workspace = true }
amoru-sources = { workspace = true }
amoru-sinks = { workspace = true }
amoru-placement = { workspace = true }
amoru-scheduler = { workspace = true }
amoru-controller = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
mimalloc = { workspace = true }
getrandom = { workspace = true }

[features]
default = []
cuda = ["amoru-arena/cuda", "amoru-discovery/cuda", "amoru-reactor/cuda", "amoru-placement/cuda"]
uring = ["amoru-reactor/uring"]
gds = ["cuda", "amoru-reactor/gds"]
rdma = ["amoru-arena/rdma", "amoru-reactor/rdma", "amoru-placement/rdma"]
python = ["amoru-adapters/python", "amoru-sources/python"]
