[package]
name = "amoru-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Amoru runtime facade"

[dependencies]
amoru-kernel = { workspace = true }
amoru-arena = { workspace = true }
amoru-discovery = { workspace = true }
amoru-trace = { workspace = true }
amoru-adapters = { workspace = true }
amoru-reactor = { workspace = true }
amoru-sources = { workspace = true }
amoru-sinks = { workspace = true }
amoru-placement = { workspace = true }
amoru-scheduler = { workspace = true }
amoru-controller = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
mimalloc = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
amoru-testkit = { workspace = true }
# The Linux branch of tests/support/mod.rs reads /proc/self/statm and needs the page
# size. A developer host is macOS, where that branch is not compiled, so its absence
# only ever showed up on CI, on the platform this runtime is actually built for.
libc = { workspace = true }

# The first program a user writes, kept at the repository root so it reads as an example and
# not as a test; the quality gate runs it on every commit.
[[example]]
name = "append_column"
path = "../../examples/append_column.rs"


[features]
default = []
cuda = ["amoru-arena/cuda", "amoru-discovery/cuda", "amoru-reactor/cuda", "amoru-placement/cuda"]
uring = ["amoru-reactor/uring"]
gds = ["cuda", "amoru-reactor/gds"]
rdma = ["amoru-arena/rdma", "amoru-reactor/rdma", "amoru-placement/rdma"]
python = ["amoru-adapters/python", "amoru-sources/python"]
