[package]
name = "moruna-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna contracts: the types and traits every component shares"

[dependencies]
arrow = { workspace = true }
dlpark = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
# Arrow IPC LZ4_FRAME and ZSTD buffers, inflated into arena buffers after every declared size is
# checked (contracts e.8); the message that describes the inflated batch is built with flatbuffers.
lz4_flex = { workspace = true }
zstd = { workspace = true }
flatbuffers = { workspace = true }
# A sink's engine's own report of a write (`SinkWrite`), carried to the run report unread.
serde_json = { workspace = true }

[dev-dependencies]
# The fakes of contracts d.15. A dev-dependency on a crate that depends on this one is not a
# cycle for the library target, and Cargo resolves it: only the tests link the testkit.
moruna-testkit = { workspace = true }

[features]
default = []
