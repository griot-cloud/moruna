[package]
name = "moruna-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna runtime facade"

[dependencies]
moruna-kernel = { workspace = true }
moruna-arena = { workspace = true }
moruna-discovery = { workspace = true }
moruna-trace = { workspace = true }
moruna-adapters = { workspace = true }
moruna-reactor = { workspace = true }
moruna-sources = { workspace = true }
moruna-sinks = { workspace = true }
moruna-placement = { workspace = true }
moruna-scheduler = { workspace = true }
moruna-controller = { workspace = true }
moruna-kernels = { workspace = true }
# `moruna run --vm` (MH 4.8.4): the monitor's library seam, `boot_and_run`.
moruna-vmm = { workspace = true }
# The peQL ends of a run (MH 4.5), feature `peql`.
moruna-datafusion = { workspace = true, optional = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }

# The vsock transport of `moruna serve` (MH 4.3) is Linux only: AF_VSOCK has no other home.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
moruna-testkit = { workspace = true }
# The Linux branch of tests/support/mod.rs reads /proc/self/statm and needs the page
# size. A developer host is macOS, where that branch is not compiled, so its absence
# only ever showed up on CI, on the platform this runtime is actually built for.
libc = { workspace = true }
# H7 (MH 4.6): a small S3-compatible server bound to a Unix socket, the only way the run in
# `tests/no_network.rs` reaches its object store; the governed tests drive a peQL engine.
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
# Reads back what the Vortex round trip in `tests/end_to_end.rs` wrote (07 SO-T30); already in
# the graph through moruna-sources and moruna-sinks.
vortex = { workspace = true }
# A loader's own binding resolver, in `tests/governed.rs`.
async-trait = "0.1"
datafusion = { workspace = true }
parcel-core = { git = "https://github.com/griot-cloud/parcel", rev = "93322ad", version = "=0.0.3" }

# The first program a user writes, kept at the repository root so it reads as an example and
# not as a test; the quality gate runs it on every commit.
[[test]]
name = "governed"
path = "tests/governed.rs"
required-features = ["peql"]

[[example]]
name = "append_column"
path = "../../examples/append_column.rs"


[features]
default = []
cuda = ["moruna-arena/cuda", "moruna-discovery/cuda", "moruna-reactor/cuda", "moruna-placement/cuda"]
uring = ["moruna-reactor/uring"]
gds = ["cuda", "moruna-reactor/gds"]
rdma = ["moruna-arena/rdma", "moruna-reactor/rdma", "moruna-placement/rdma"]
python = ["moruna-adapters/python", "moruna-sources/python"]
# `"kind": "datafusion"` sources and `"kind": "peql"` sinks in the job document (MH 4.5).
peql = ["dep:moruna-datafusion", "moruna-datafusion/peql"]
