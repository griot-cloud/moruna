[package]
name = "moruna-micro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The engine on the Moruna microkernel (SDD 30): the same engine as on a Linux node, a Linux program the personality started with granted handles, reaching the vsock driver, the personality and the data plane through the kernel's own calls"

[dependencies]
moruna-kernel = { workspace = true }
moruna-adapters = { workspace = true }
tracing = { workspace = true }
# Item 3.6: the `functions` index `node-admission` writes, read with the contract's own parser.
node-protocol = { workspace = true }

# The kernel's calls exist on the Moruna kernel only, and it runs x86-64 programs: everything
# that makes them is built for that target alone. Elsewhere the crate says the kernel is not
# there, and nothing else.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = { workspace = true }
moruna-sys = { workspace = true }
moruna-svc = { workspace = true, features = ["native"] }
moruna-plane = { workspace = true, features = ["native"] }
vsock-protocol = { workspace = true }
linux-protocol = { workspace = true }
moruna-record = { workspace = true }
# Stream C: the arena on granted memory objects and the engine's own virtio-blk queues, with
# the virtio, PCI and register code Moruna's driver processes use.
moruna-arena = { workspace = true }
moruna-abi = { workspace = true }
moruna-mmio = { path = "../../kernel/drivers/mmio", version = "=0.1.0" }
moruna-pci = { path = "../../kernel/drivers/pci", version = "=0.1.0" }
moruna-virtio = { path = "../../kernel/drivers/virtio", version = "=0.1.0" }
# Stream C: the output layer's format, and its pages' hashes.
moruna-imagefs = { workspace = true }
sha2 = { workspace = true }

imagefs-protocol = { workspace = true }

# stream P: the plane's rings layout, which a test checks the ring sizes against on any host.
[dev-dependencies]
moruna-plane = { workspace = true }

# Stream C: the output layer read back with the host's own reader.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
moruna-image = { workspace = true }
