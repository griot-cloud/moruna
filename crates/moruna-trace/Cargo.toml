[package]
name = "moruna-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna trace writer and run report"

[dependencies]
moruna-kernel = { workspace = true }
arrow = { workspace = true }
crossbeam = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The runtime sets mimalloc as the global allocator for the whole process (12 l); the TR-T4
# memory bound is a claim about that process, so the test binary sets the same allocator.
# The crate is the preamble 6.2 table's `mimalloc` at its pinned version, and it is a test
# dependency only: it is in no shipping crate's graph.
mimalloc = { workspace = true }

[features]
default = []
