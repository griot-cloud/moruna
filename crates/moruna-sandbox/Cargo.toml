[package]
name = "moruna-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna's runtime for a .pex function package: a confined child forked from a warm template (SDD 17)"

[dependencies]
moruna-kernel = { workspace = true }
# The guard (05 f.9 to f.14) and the boundary copy (05 f.3); `python` adds the child's runner.
moruna-adapters = { workspace = true }
moruna-package = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The child's runner (17 f.6): the package's callable under the adapter, inside the child.
pyo3 = { workspace = true, optional = true }
moruna-arena = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
landlock = { workspace = true }
seccompiler = { workspace = true }

[dev-dependencies]
moruna-testkit = { workspace = true }
zip = { workspace = true }

[features]
default = []
python = ["dep:pyo3", "dep:moruna-arena", "moruna-adapters/python"]
