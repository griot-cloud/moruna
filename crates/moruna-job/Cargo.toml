[package]
name = "moruna-job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Moruna's kinds and job document, read and checked without running anything"

# What an embedder depends on to read Moruna's kinds and check a job document (SDD 22). Nothing
# from Arrow, DataFusion or the runtime: it compiles in a service that never runs a job.
[dependencies]
# The job document version 2 is FlatBuffers, its tasks' settings FlexBuffers (SDD 22 e.4).
flatbuffers = { workspace = true }
flexbuffers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The settings schema each kind declares (SDD 18 e.2).
schemars = { workspace = true }
thiserror = { workspace = true }
# The type grammar of a served kind's schema rules (MH 4.9), the one reader the runtime's Arrow
# types are converted from; a workspace crate with no dependency of its own (JB-I16).
moruna-types = { workspace = true }
