# The PM's control 1 on 0.6.6: the gate's Rust ports as a Python extension, `moruna_gate`, so
# 0.6.6's `moruna.run` can run them as it runs any Python function. 0.6.6 has no entry that names
# a Rust kernel (the `rust` entry left in 0.5.8, architecture/sdd/18-kinds.md KD-I7), and its
# wheel registers no Rust kind; a callable it can run is the route that changes nothing in 0.6.6.
# Its own workspace: it needs a Python to build against, and the gate workspace's tests need none.
[workspace]
resolver = "3"

[package]
name = "moruna-gate-py066"
description = "The gate's seven Rust functions for 0.6.6's moruna.run: pyarrow RecordBatch in and out"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "moruna_gate_native"
crate-type = ["cdylib"]

[dependencies]
moruna-gate-functions = { path = "../functions" }
# The root workspace's pins (Cargo.toml).
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
pyo3-arrow = { version = "=0.19.0" }
arrow = { version = "=59.3.0", default-features = false }

[build-dependencies]
# macOS needs `-undefined dynamic_lookup` for an extension module; maturin adds it itself.
pyo3-build-config = { version = "=0.29.2" }
