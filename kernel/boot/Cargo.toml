[package]
name = "moruna-microkernel-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "moruna-microkernel"
path = "src/main.rs"

[dependencies]
ostd.workspace = true
osdk-frame-allocator.workspace = true
osdk-heap-allocator.workspace = true
moruna-microkernel.workspace = true

[features]
probe = ["moruna-microkernel/probe"]
# stream U: the usage build (kernel/tools/build.sh with MORUNA_USAGE=1), which also compiles
# every crate with `-C instrument-coverage`. Off in every other build.
usage = []
