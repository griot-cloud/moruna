# libmoruna_function.a, the C library of native functions (architecture/moruna-os-system.md, 5B):
# the calls of moruna_function.h over moruna-function (5A), batches crossing by the Arrow C Data
# Interface. Its own workspace, as kernel/function/rust is: arrow-rs's FFI is needed here only.
# The kernel's toolchain (kernel/rust-toolchain.toml) is the one it builds with.
[workspace]
resolver = "3"

[package]
name = "moruna-function-c"
description = "The C header of native Moruna functions over moruna-function, batches by the Arrow C Data Interface (system design 5B)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
# The archive C programs link: libmoruna_function.a.
name = "moruna_function"
crate-type = ["staticlib", "rlib"]

[dependencies]
# moruna-function's own pins, so the batches are the arrow-rs types it reads and writes.
# Not arrow-array's ffi feature: its C stream interface takes errno values from the libc crate,
# which knows no Moruna; the import is src/import.rs, arrow-array's own, and the export
# arrow-data's and arrow-schema's.
arrow-array = { version = "=59.3.0", default-features = false }
arrow-buffer = { version = "=59.3.0", default-features = false }
arrow-data = { version = "=59.3.0", default-features = false, features = ["ffi"] }
arrow-schema = { version = "=59.3.0", default-features = false, features = ["ffi"] }
# Renamed: this library is `moruna_function` to C, as the archive's name.
sdk = { package = "moruna-function", path = "../rust", version = "=0.1.0" }

# On the core, the C library C functions link: relibc on Moruna's platform (system design 5B, item
# 5.2b), in this one crate graph with std and the SDK. Without its runtime feature: std has the
# panic and allocation-error handlers.
[target.'cfg(target_os = "moruna")'.dependencies]
relibc = { path = "../../vendor/relibc", version = "=0.2.5", default-features = false, features = ["no_trace"] }
# arrow-array's ahash reaches getrandom 0.3, whose custom backend on the core is the core's
# random_read (item 5.0).
moruna-getrandom = { path = "../../getrandom", version = "=0.1.0" }

# A program of its own, run by `cargo test` on the host and linked for the core by build-core.sh
# (bin/threads): one thread path for std's thread-locals and the C library's.
[[test]]
name = "threads"
harness = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("moruna"))'] }
