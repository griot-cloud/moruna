[package]
name = "linuxlayer-launch"
description = "How the Linux personality is launched into a program's process: the contract between launcher and personality, and (feature `launcher`) the launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# The launcher itself: a created process given the personality, on Moruna's core.
launcher = ["dep:moruna-sys"]

[dependencies]
moruna-abi.workspace = true
moruna-loader = { path = "../../loader", version = "=0.1.0" }
moruna-sys = { workspace = true, optional = true }

[[bin]]
name = "linuxlayer-boot"
required-features = ["launcher"]

[lints]
workspace = true
