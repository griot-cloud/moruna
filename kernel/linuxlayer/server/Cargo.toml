[package]
name = "linuxlayer-server"
description = "The drop-in `linux` server: linux-protocol's run, run_plane, run_granted and layers, each program run on its own Linux personality"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "linux"
path = "src/main.rs"
test = false

[dependencies]
linux-protocol.workspace = true
linuxlayer-launch.workspace = true
moruna-record.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
imagefs-protocol.workspace = true
linuxlayer-launch = { workspace = true, features = ["launcher"] }
moruna-node.workspace = true
moruna-svc.workspace = true
moruna-sys.workspace = true

[lints]
workspace = true
