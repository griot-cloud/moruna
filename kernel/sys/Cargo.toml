[package]
name = "moruna-sys"
description = "Safe wrappers over the Moruna microkernel's native syscalls, for no_std userland processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# A global allocator over memory objects, so a program has `alloc` (moruna-svc turns
# it on).
heap = []
# stream P: `plane::Log`, a native task's lines into the log ring the engine gives it. Its
# records are `moruna-record`'s, which links alloc, so a program with it also has `heap`.
log = ["dep:moruna-record"]
# stream U: the usage build (kernel/tools/build.sh with MORUNA_USAGE=1, which also compiles with
# `-C instrument-coverage`): a program prints its coverage counters on its console when idle
# and at exit (src/usage.rs). Off in every other build.
usage = ["dep:moruna-usage"]
# Item 5.0 (system design 5A0): `rt`, the runtime Rust's std calls for `target_os = "moruna"`
# (kernel/vendor/rust-std): the entry, threads and their thread-local keys, the futex calls with
# timeouts, the clock, stdout and stderr as lines of the task's log. The heap is the process's
# memory, but not the global allocator: std's `System` allocates from it.
rt = ["heap", "log"]
# Item 5.0: built as a dependency of std, whose `core` and `alloc` are the ones being built
# beside it (kernel/vendor/rust-std/library/std/Cargo.toml).
rustc-dep-of-std = [
    "rt",
    "dep:core",
    "dep:alloc",
    "moruna-abi/rustc-dep-of-std",
    "moruna-record/rustc-dep-of-std",
]

[dependencies]
moruna-abi.workspace = true
# stream U: the dump's encoder (feature `usage`).
moruna-usage = { path = "../usage", version = "=0.1.0", optional = true }
# stream P: `plane::Log`'s records (feature `log`).
moruna-record = { path = "../../crates/moruna-record", version = "=0.6.6", default-features = false, optional = true }
# Item 5.0: only when built as a dependency of std (feature `rustc-dep-of-std`).
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }
