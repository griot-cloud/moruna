# The toolchain OSTD 0.19.0 is built and tested with (asterinas/asterinas v0.19.0,
# rust-toolchain.toml). The kernel workspace builds core and alloc from source for
# x86_64-unknown-none, which needs rust-src.
[toolchain]
channel = "nightly-2026-07-21"
components = ["rust-src", "rustfmt", "clippy", "llvm-tools-preview"]
targets = ["x86_64-unknown-none"]
profile = "minimal"
