[package]
name = "moruna-api-server"
description = "The node's API server as a library: TLS 1.3, HTTP/1.1, the operations of moruna-api and their limits, over a byte-stream transport the caller drives"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moruna-api = { path = "../types", version = "=0.1.0" }
# A job's events (system design 3B): the record each one is, and its rendering as JSON.
moruna-event = { path = "../../../crates/moruna-event", version = "=0.6.6", default-features = false }
moruna-record = { path = "../../../crates/moruna-record", version = "=0.6.6", default-features = false }
httparse = { version = "=1.10.1", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
# `raw_value`: a job's document and its report pass through as the text they arrived as.
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc", "raw_value"] }
# The network server's versions (kernel/net/stack).
rustls = { version = "=0.23.45", default-features = false, features = ["ring"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }

# On the kernel, ring's randomness comes from moruna_svc::random, as the network server's does.
[target.'cfg(target_os = "none")'.dependencies]
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "less-safe-getrandom-custom-or-rdrand"] }
getrandom = { version = "=0.2.17", features = ["custom"] }
moruna-svc.workspace = true

[features]
# For the `cloud-test` image profile only, never a release image (work item 2.2c): a request to
# `/v1/test/exit`, with no token, asks the server's caller to end, so that a test can kill `api`
# from outside the node's design. Without it that path is in no operation.
test-exit = []

[dev-dependencies]
# A real rustls client for the tests, as the network server's tests use; `tls12` so that a test
# can show the server refuses a TLS 1.2 client.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
