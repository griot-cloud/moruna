[package]
name = "moruna-node-supervisor"
description = "Capability-scoped standalone Moruna node supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "node-supervisor"
path = "src/main.rs"
test = false
bench = false

[dependencies]
moruna-node = { path = "../core", version = "=0.1.0" }
moruna-sys = { workspace = true, features = ["heap"] }

node-protocol = { path = "../protocol", version = "=0.1.0" }
