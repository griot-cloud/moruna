moruna-node 1
# The cloud profile's node (system design 1A). `link SERVER SLOT CLIENT SLOT`: the left
# service serves on its end and the right one is its client, and a service that is not on
# a machine takes its clients with it (1F: off Hyper-V, `vmbus` and its clients).
service devices image.devices 67108864
bootstrap devices devices until-stopped
grant devices drivers drivers
grant devices driver.virtio-blk driver.virtio-blk
grant devices driver.virtio-net driver.virtio-net
grant devices driver.nvme driver.nvme
grant devices driver.gve driver.gve
grant devices disk.guid disk.guid
# On Hyper-V, the VMBus services start before the network server. Correctness does not
# depend on it: the device manager holds each register slot linked here, and a lookup of a
# name not yet registered (the network server's of net0) waits until every held slot's
# driver has finished registering. netvsc has no DMA grant: vmbus pins the buffers it
# shares (1F).
service vmbus image.vmbus 33554432
grant vmbus root.hyperv root.hyperv
grant vmbus dma dma.vmbus
service storvsc image.storvsc 33554432
grant storvsc dma dma.storvsc
grant storvsc disk.guid disk.guid.storvsc
link vmbus scsi storvsc vmbus
link devices register-storvsc storvsc devices
service netvsc image.netvsc 50331648
link vmbus net netvsc vmbus
link devices register-netvsc netvsc devices
service network image.netstack 67108864
service api image.api 67108864
grant network config network.config
link devices directory-net network directory
service platform image.platform 16777216
bootstrap platform platform
link network listen-platform platform network
# Step 3 (system design 1A, 3A; item 3.2): the image filesystem, the Linux personality and
# node-admission, which starts each job's and each check's engine and takes the rest of the
# node's memory. No storage: a cloud node's jobs reach data through volumes and the network.
# The engine's layer is the boot disk's moruna-system partition, which the disk's driver
# serves as `system` (item 3.3); package.py writes linux.layers naming it.
service imagefs image.imagefs 268435456
grant imagefs layers linux.layers
link devices directory-fs imagefs directory
service linux image.linux 268435456
bootstrap linux linux
link imagefs listen-linux linux fs
service node-admission image.admission rest
bootstrap admission node-admission
grant node-admission root.process root.process
grant node-admission engine-image image.engine
link linux listen-engine node-admission linux
link network listen-engine node-admission network
link devices directory-admission node-admission directory
# The supervisor is node-admission's client, and gives each start of `api` a fresh connection
# on its `admission` slot (item 3.2), which ends with that start.
link node-admission listen supervisor admission
restart api network network listen-supervisor admission rights=listen local=0.0.0.0/0@443 sockets=81 rx=65536 tx=65536 per-peer=8 linger=5000
# The check variant (item 1.10b): `storvsc-check`, a client of the device manager's directory.
service storvsc-check image.storvsc-check 33554432
link devices directory-check storvsc-check directory
