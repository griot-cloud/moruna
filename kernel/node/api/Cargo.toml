[package]
name = "moruna-node-api"
description = "The node's api process: it owns the node's one listening port, TCP 443, and serves the node's API there through moruna-api-server, over the network server's sockets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The image names the program `api` (`program:api`, kernel/node/cloud.image).
[[bin]]
name = "api"
path = "src/main.rs"
test = false
bench = false

[dependencies]
moruna-svc.workspace = true
netstack-protocol = { path = "../../net/protocol", version = "=0.1.0" }
# The hand-over `platform` sends, and `api`'s answer (work item 1.4).
moruna-node-config = { path = "../config", version = "=0.1.0" }
# The API server (item 2.2) and the node document's types (2A).
moruna-api-server = { path = "../../api/server", version = "=0.1.0" }
moruna-api = { path = "../../api/types", version = "=0.1.0" }

[features]
# For the `cloud-test` image profile only, never a release image (work item 2.2c): `api` exits
# on a request to `/v1/test/exit`, so that a test can kill it from outside the node's design.
# kernel/node/tools/package.py turns it on for `--profile cloud-test` and for no other profile.
test-exit = ["moruna-api-server/test-exit"]

# The host tests run the library against the network server's own stack, with a DHCP
# server and a second card on its wire (kernel/net/stack/tests/common).
[dev-dependencies]
moruna-netstack = { path = "../../net/stack", version = "=0.1.0" }
# platform's own end of the link, for the hand-over's test over a real channel.
moruna-node-platform = { path = "../platform", version = "=0.1.0" }
smoltcp = { version = "=0.13.1", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-dhcpv4"] }
heapless = { version = "=0.9.3", default-features = false }
# An HTTPS client, a token issuer and the answers' JSON, as the API server's own tests have
# them, at the workspace's versions.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
httparse = { version = "=1.10.1", default-features = false }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
# The operator's certificate and key, for the identity's test, as the network server's tests
# make theirs.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "crypto"] }
