[package]
name = "moruna-node-api"
description = "The node's api process: it owns the node's one listening port, TCP 443; in step 1 it accepts each connection and closes it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The image names the program `api` (`program:api`, kernel/node/cloud.image).
[[bin]]
name = "api"
path = "src/main.rs"
test = false
bench = false

[dependencies]
moruna-svc.workspace = true
netstack-protocol = { path = "../../net/protocol", version = "=0.1.0" }

# The host tests run the library against the network server's own stack, with a DHCP
# server and a second card on its wire (kernel/net/stack/tests/common).
[dev-dependencies]
moruna-netstack = { path = "../../net/stack", version = "=0.1.0" }
smoltcp = { version = "=0.12.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-dhcpv4"] }
heapless = { version = "=0.8.0", default-features = false }
