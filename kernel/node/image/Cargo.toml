[package]
name = "moruna-node-image"
description = "Validates standalone node assembly against canonical boot and engine parsers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
moruna-node = { path = "../core", version = "=0.1.0" }
moruna-image = { path = "../../tools/image", version = "=0.1.0" }
engine = { path = "../../engine", version = "=0.1.0" }
moruna-netstack = { path = "../../net/stack", version = "=0.1.0" }
# The `grant` right a restart record's granting slot must hold (item 2.2c).
netstack-protocol = { path = "../../net/protocol", version = "=0.1.0" }

moruna-storage-format = { path = "../../../crates/moruna-storage-format", version = "=0.6.6", default-features = false, features = ["pure", "crypto"] }

[features]
default = []
# Explicit one-shot KD3 fixture assembly, never a production server fallback.
kd3-conformance-proof = []
