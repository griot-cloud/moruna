[package]
name = "moruna-node"
description = "Standalone Moruna node configuration and service lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# A job's network (`egress`): the network server's policy types and client.
moruna-svc.workspace = true
netstack-protocol = { path = "../../net/protocol", version = "=0.1.0" }

[target.'cfg(target_os = "none")'.dependencies]
moruna-sys.workspace = true

[dev-dependencies]
# `egress` minted and used against the real network server's logic, over loopback.
moruna-netstack = { path = "../../net/stack", version = "=0.1.0" }
