[package]
name = "node-admission"
description = "Long-lived capability-scoped native Moruna job admission process"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[[bin]]
name = "node-admission"
path = "src/main.rs"
test = false
bench = false
[dependencies]
moruna-svc.workspace = true
moruna-sys.workspace = true
node-protocol = { path = "../protocol", version = "=0.1.0" }
# A job's network (item 3.4): admission's client of the network server.
netstack-protocol = { path = "../../net/protocol", version = "=0.1.0" }
# A job's functions (item 3.6): fetched, checked, kept and handed to the engine.
node-functions = { path = "../functions", version = "=0.1.0" }

moruna-node = { path = "../core", version = "=0.1.0" }

moruna-storage-service = { path = "../../storage", version = "=0.1.0" }
moruna-storage-format = { path = "../../../crates/moruna-storage-format", version = "=0.6.6", default-features = false, features = ["pure"] }
devices-protocol = { path = "../../devices/protocol", version = "=0.1.0" }
