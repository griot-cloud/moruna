moruna-netstack 1
interface wan card=net0 dhcp
grant listen-supervisor rights=grant,listen local=0.0.0.0/0@443 sockets=81 rx=65536 tx=65536 per-peer=8 linger=5000
grant listen-platform rights=connect remote=169.254.169.254/32@80,168.63.129.16/32@80 local=0.0.0.0/0 sockets=16
# node-admission's client (system design 3D, item 3.4): every name at 443, held by admission
# alone, which never connects itself and mints each job a connection to its own hosts.
grant listen-admission rights=grant,connect local=any names=*@443 sockets=64
