# Supply-chain policy for the kernel workspace (kernel/), its own Cargo workspace and
# so its own `cargo-deny` configuration. The root deny.toml's rules apply unchanged;
# differences are MPL-2.0 for OSTD (DECISIONS.md MK1), and scoped 0BSD
# exceptions for the native network stack's smoltcp and managed dependencies.
#
#   cargo deny --manifest-path kernel/Cargo.toml check advisories licenses bans sources
#
# (cargo-deny reads the deny.toml beside the manifest it is given.)

[graph]
all-features = true
# The kernel's target, and the hosts its pure crates are tested on.
targets = [
  "x86_64-unknown-none",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
# As in the root deny.toml: config version 2, so a vulnerability is always an error, a yanked
# crate in the lock file is an error too, and an advisory is ignored only by the PM, with the
# reason, the date and the event that removes it written on the entry (cargo-deny 0.20.2 takes
# only `id` and `reason`).
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # paste 1.0.15 is unmaintained, not vulnerable: its author archived it. It is a
  # compile-time proc-macro, and the kernel graph reaches it once, through the vendored
  # osdk-frame-allocator 0.19.0 (kernel/vendor), whose `fast_smp_counter!` macro uses
  # `paste!` to name a per-CPU static. Nothing of it is left in the kernel at run time. The
  # vendored crate is not edited to swap in a fork. Decided by the PM on 2026-11-19 (work
  # item S.1).
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is unmaintained, not vulnerable; a compile-time proc-macro used once, by `fast_smp_counter!` in the vendored osdk-frame-allocator 0.19.0, with nothing left at run time; re-decided when the vendored OSTD copy is updated (PM, 2026-11-19, S.1)" },
]

[licenses]
# The root allow list, plus MPL-2.0. MPL-2.0 is file-level copyleft: a file taken from
# an MPL project stays MPL and its source stays available, and nothing else in the
# work is touched. OSTD and the crates published with it are MPL-2.0 (`ostd`,
# `ostd-macros`, `ostd-pod`, `ostd-pod-macros`, `ostd-test`, `osdk-frame-allocator`,
# `osdk-heap-allocator`, `linux-boot-params`, `id-alloc`, `align_ext`, `int-to-c-enum`,
# `int-to-c-enum-derive`, `padding-struct`), as is the linker script
# kernel/boot/x86_64.ld copied from OSDK. Brackly accepted it on 2026-10-28.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.93

# The native network stack's existing dependencies use the BSD Zero Clause
# licence. Keep this exception package-scoped rather than allowing new 0BSD
# dependencies across the workspace without review.
[[licenses.exceptions]]
crate = "smoltcp"
allow = ["0BSD"]

[[licenses.exceptions]]
crate = "managed"
allow = ["0BSD"]

# The crates vendored from Microsoft's OpenVMM (kernel/vendor/openvmm, item 1.9a) are MIT:
# every file says so and the repository's LICENSE is the MIT text, but their manifests
# name no licence. Each clarification holds only while kernel/vendor/openvmm/LICENSE,
# which is that text as fetched, keeps this hash.
[[licenses.clarify]]
crate = "guestmem_core"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "guid"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "hvdef"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "net_backend_core"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "netvsp_protocol"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "open_enum"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "safeatomic"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "scsi_defs"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "storvsp_protocol"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "vmbus_core"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "vmbus_ring"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[[licenses.clarify]]
crate = "x86defs"
expression = "MIT"
license-files = [{ path = "../LICENSE", hash = 0x45c4defe }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
