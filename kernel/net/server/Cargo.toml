[package]
name = "netstack"
description = "The network server: a process on the Moruna microkernel serving moruna.net over the network cards its configuration names, with TCP/IP from smoltcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moruna-svc.workspace = true
moruna-netstack = { path = "../stack", version = "=0.1.0" }
netstack-protocol = { path = "../protocol", version = "=0.1.0" }
net-protocol = { path = "../../drivers/net-protocol", version = "=0.1.0" }
devices-protocol = { path = "../../devices/protocol", version = "=0.1.0" }
