[package]
name = "relibc"
version = "0.2.5"
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
edition = "2024"
license = "MIT"

# Moruna (item 5.2b): an rlib in one crate graph with std, moruna-function and its C library
# (system design 5B); `cargo rustc --crate-type staticlib --features runtime` makes the archive
# a program without std links.
[lib]
name = "relibc"
crate-type = ["rlib"]

# Moruna: its own workspace under kernel/vendor, as upstream's is; Redox's own crates (redox-rt,
# redox-ioctl), the dynamic linker (ld_so) and the crt objects are not vendored.
[workspace]
members = ["generic-rt"]
exclude = ["tests", "dlmalloc-rs"]

[workspace.lints.clippy]
borrow_as_ptr = "deny"
cast_lossless = "deny"
cast_possible_truncation = "allow" # TODO review occurrences
cast_possible_wrap = "allow" # TODO review occurrences
cast_precision_loss = "deny"
cast_ptr_alignment = "allow" # TODO review occurrences
cast_sign_loss = "allow" # TODO review occurrences
from_raw_with_void_ptr = "deny"
ignored_unit_patterns = "deny"
implicit_clone = "deny"
manual_let_else = "deny"
missing_errors_doc = "allow" # TODO review occurrences
missing_panics_doc = "allow" # TODO review occurrences
missing_safety_doc = "allow" # TODO review occurrences
mut_from_ref = "deny"
precedence = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
ptr_offset_by_literal = "deny"
ref_as_ptr = "deny"
zero_ptr = "deny" # must allow on public constants due to cbindgen issue

[workspace.lints.rust]
dangling_pointers_from_temporaries = "deny"
dead_code = "allow" # TODO review occuurences
deprecated = "deny"
improper_ctypes_definitions = "deny"
internal_features = "allow" # core_intrinsics and lang_items
irrefutable_let_patterns = "deny"
mismatched_lifetime_syntaxes = "deny"
non_camel_case_types = "allow" # needed for most POSIX type names
non_snake_case = "deny"
non_upper_case_globals = "allow" # TODO review occurences
unexpected_cfgs = "deny"
unpredictable_function_pointer_comparisons = "deny"
unreachable_code = "allow" # TODO review occuurences
unsafe_op_in_unsafe_fn = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_mut = "deny"
unused_unsafe = "deny"
unused_variables = "deny"

[lints]
workspace = true

[workspace.dependencies]
bitflags = "2"
plain = "0.2"

[build-dependencies]
cc = "1"

[dependencies]
bitflags.workspace = true
arrayvec = { version = "0.7.6", default-features = false }
cbitset = "0.2"
posix-regex = { version = "0.1.4", features = ["no_std"] }

rand = { version = "0.10", default-features = false }
rand_xorshift = "0.5"
rand_jitter = "0.6"

memchr = { version = "2.2.0", default-features = false }
plain.workspace = true
unicode-width = "0.1"
md5-crypto = { package = "md-5", version = "0.10.6", default-features = false }
sha-crypt = { version = "0.5", default-features = false }
base64ct = { version = "1.6", default-features = false, features = ["alloc"] }
bcrypt-pbkdf = { version = "0.10", default-features = false, features = [
    "alloc",
] }
scrypt = { version = "0.11", default-features = false, features = ["simple"] }
pbkdf2 = { version = "0.12", features = ["sha2"] }
sha2 = { version = "0.10", default-features = false }
generic-rt = { path = "generic-rt", version = "=0.1.0" }
chrono-tz = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
libm = "0.2"
log = "0.4"
spin = "0.9.8"
argon2 = "0.5.3"

zerocopy = { version = "0.8.55", features = ["derive"] }

[dependencies.dlmalloc]
path = "dlmalloc-rs"
version = "=0.2.8"
default-features = false
features = ["c_api"]

# Moruna: crates.io's object, the release upstream's fork branches from, for the ELF reading
# the static TLS setup and dl_iterate_phdr use.
[dependencies.object]
version = "0.36.7"
default-features = false
features = ["elf", "read_core"]

# Moruna: its platform, over moruna-sys (src/platform/moruna). Linux's and Redox's system call
# crates are not vendored: neither platform is built here.
[target.'cfg(target_os = "moruna")'.dependencies]
relibc-moruna = { path = "../../relibc-moruna", version = "=0.1.0" }

[features]
# to enable trace level, take out this `no_trace`
default = ["no_trace"]
# Moruna: the libc crate the check compares layouts with knows no Moruna, and is not vendored.
check_against_libc_crate = []
# Moruna: the panic and allocation-error handlers, for a program without std; std has its own.
runtime = []
math_libm = []
no_trace = ["log/release_max_level_debug"]
# for very verbose activity beyond trace level
trace_tls = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
