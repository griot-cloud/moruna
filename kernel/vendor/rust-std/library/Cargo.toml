cargo-features = ["profile-rustflags"]

[workspace]
resolver = "1"
members = [
  "std",
  "sysroot",
  "coretests",
  "alloctests",
]

exclude = [
  # stdarch has its own Cargo workspace
  "stdarch",
  "windows_link"
]

[profile.release.package.compiler_builtins]
# For compiler-builtins we always use a high number of codegen units.
# The goal here is to place every single intrinsic into its own object
# file to avoid symbol clashes with the system libgcc if possible. Note
# that this number doesn't actually produce this many object files, we
# just don't create more than this number of object files.
#
# It's a bit of a bummer that we have to pass this here, unfortunately.
# Ideally this would be specified through an env var to Cargo so Cargo
# knows how many CGUs are for this specific crate, but for now
# per-crate configuration isn't specifiable in the environment.
codegen-units = 10000

# These dependencies of the standard library implement symbolication for
# backtraces on most platforms. Their debuginfo causes both linking to be slower
# (more data to chew through) and binaries to be larger without really all that
# much benefit. This section turns them all to down to have no debuginfo which
# helps to improve link times a little bit.
[profile.release.package]
addr2line.debug = 0
addr2line.opt-level = "s"
adler2.debug = 0
gimli.debug = 0
gimli.opt-level = "s"
miniz_oxide.debug = 0
miniz_oxide.opt-level = "s"
# `opt-level = "s"` for `object` led to a size regression when tried previously
object.debug = 0
rustc-demangle.debug = 0
rustc-demangle.opt-level = "s"

# panic_abort must always be compiled with panic=abort, even when the rest of the
# sysroot is panic=unwind.
[profile.dev.package.panic_abort]
rustflags = ["-Cpanic=abort"]

[profile.release.package.panic_abort]
rustflags = ["-Cpanic=abort"]

# The "dist" profile is used by bootstrap for prebuilt libstd artifacts
# These settings ensure that the prebuilt artifacts support a variety of features
# in the user's profile.
[profile.dist]
inherits = "release"
codegen-units = 1
debug = 1 # "limited"
rustflags = [
    # `profile.lto=off` implies `-Cembed-bitcode=no`, but unconditionally embedding
    # bitcode is necessary for when users enable LTO.
    # Required until Cargo can re-build the standard library based on the value
    # of `profile.lto` in the user's profile.
    "-Cembed-bitcode=yes",
    # Enable frame pointers
    "-Zunstable-options",
    "-Cforce-frame-pointers=non-leaf",
]

[profile.dist.package.panic_abort]
rustflags = [
    "-Cpanic=abort",
    "-Cembed-bitcode=yes",
    "-Zunstable-options",
    "-Cforce-frame-pointers=non-leaf",
]

[patch.crates-io]
# See comments in `library/rustc-std-workspace-core/README.md` for what's going on here
rustc-std-workspace-core = { path = 'rustc-std-workspace-core' }
rustc-std-workspace-alloc = { path = 'rustc-std-workspace-alloc' }
rustc-std-workspace-std = { path = 'rustc-std-workspace-std' }

# See comments in `library/windows-sys/Cargo.toml` for why this is patched
windows-sys = { path = 'windows-sys' }
# moruna: std's crates.io dependencies are the copies rust-src carries in vendor/, so that
# build-std fetches nothing (kernel/vendor/rust-std/README.md; kernel/tools/build-std.sh checks).
addr2line = { path = 'vendor/addr2line-0.27.0' }
adler2 = { path = 'vendor/adler2-2.0.1' }
cc = { path = 'vendor/cc-1.2.0' }
cfg-if = { path = 'vendor/cfg-if-1.0.4' }
dlmalloc = { path = 'vendor/dlmalloc-0.2.13' }
foldhash = { path = 'vendor/foldhash-0.2.0' }
fortanix-sgx-abi = { path = 'vendor/fortanix-sgx-abi-0.6.1' }
getopts = { path = 'vendor/getopts-0.2.24' }
gimli = { path = 'vendor/gimli-0.34.0' }
hashbrown = { path = 'vendor/hashbrown-0.17.1' }
hermit-abi = { path = 'vendor/hermit-abi-0.5.2' }
libc = { path = 'vendor/libc-0.2.185' }
memchr = { path = 'vendor/memchr-2.7.6' }
miniz_oxide = { path = 'vendor/miniz_oxide-0.9.1' }
moto-rt = { path = 'vendor/moto-rt-0.16.0' }
object = { path = 'vendor/object-0.39.1' }
r-efi = { path = 'vendor/r-efi-5.3.0' }
r-efi-alloc = { path = 'vendor/r-efi-alloc-2.1.0' }
rand = { path = 'vendor/rand-0.9.2' }
rand_core = { path = 'vendor/rand_core-0.9.3' }
rand_xorshift = { path = 'vendor/rand_xorshift-0.4.0' }
rustc-demangle = { path = 'vendor/rustc-demangle-0.1.28' }
rustc-literal-escaper = { path = 'vendor/rustc-literal-escaper-0.0.8' }
shlex = { path = 'vendor/shlex-1.3.0' }
unwinding = { path = 'vendor/unwinding-0.2.10' }
vex-sdk = { path = 'vendor/vex-sdk-0.27.1' }
wasip1 = { path = 'vendor/wasip1-1.0.0' }
wasip2 = { path = 'vendor/wasip2-1.0.3+wasi-0.2.9' }
wasip3 = { path = 'vendor/wasip3-0.6.0+wasi-0.3.0-rc-2026-03-15' }
wit-bindgen = { path = 'vendor/wit-bindgen-0.57.1' }
