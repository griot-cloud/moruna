# The engine's start in the CI boot (SDD 30 d.3, k), read by the engine's supervisor from
# its `config` data handle: Moruna's engine, a static musl build of the root workspace's
# `moruna-engine`, in the Linux image's top layer, run by the Linux personality five times,
# once for each job the host's embedder (kernel/tools/embedder.py) sends over vsock.
program /moruna/bin/moruna-engine
arg serve
arg --listen
arg vsock://-1:5100
env HOME=/tmp
env RUST_BACKTRACE=1
# What its machine has: the arena and every buffer of a run come out of this.
memory 1073741824
# Its /tmp: staging, the report, the sink's files.
scratch 268435456
# Its connection to the vsock driver; the personality's listener, which it starts its
# tasks through; and the record of the image the boot attached (build.sh), which an image
# entry's reference is checked against (SDD 30 f.12).
grant vsock lookup vsock0
grant linux personality
grant image data image
runs 5
