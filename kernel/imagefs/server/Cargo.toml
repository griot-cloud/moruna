[package]
name = "imagefs"
description = "The image filesystem server: a task's image layers, read-only block devices, merged into one tree and paged in on demand through a shared, verified page cache, with the task's scratch directory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moruna-svc.workspace = true
moruna-imagefs = { path = "../fs", version = "=0.1.0" }
imagefs-protocol = { path = "../protocol", version = "=0.1.0" }
block-protocol = { path = "../../drivers/block-protocol", version = "=0.1.0" }
devices-protocol = { path = "../../devices/protocol", version = "=0.1.0" }
