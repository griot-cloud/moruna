[package]
name = "gve"
description = "The gVNIC driver: a process on the Moruna microkernel serving moruna.driver.net for Google's virtual NIC in the GQI queue format; not yet proven on hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moruna-svc.workspace = true
moruna-mmio = { path = "../mmio", version = "=0.1.0" }
moruna-pci = { path = "../pci", version = "=0.1.0" }
moruna-gve = { path = "../gve-core", version = "=0.1.0" }
net-protocol = { path = "../net-protocol", version = "=0.1.0" }
