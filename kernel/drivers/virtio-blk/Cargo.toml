[package]
name = "virtio-blk"
description = "The virtio block driver: a process on the Moruna microkernel serving moruna.driver.block, moving data by DMA straight into its clients' memory objects"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Work item 1.6d, for diagnosis only: the driver registers its disks 10 s after its device is
# up, so a client's lookup of one (imagefs's of `system`) comes first, as on Servercore's KVM
# (run 8). A node's normal image never turns it on; `package.py --feature
# virtio-blk/register-late` builds the image that does.
register-late = []

[dependencies]
moruna-svc.workspace = true
moruna-mmio = { path = "../mmio", version = "=0.1.0" }
moruna-pci = { path = "../pci", version = "=0.1.0" }
moruna-virtio = { path = "../virtio", version = "=0.1.0" }
block-protocol = { path = "../block-protocol", version = "=0.1.0" }
moruna-disk = { path = "../disk", version = "=0.1.0" }
devices-protocol = { path = "../../devices/protocol", version = "=0.1.0" }
