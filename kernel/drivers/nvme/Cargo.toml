[package]
name = "nvme"
description = "The NVMe driver: a process on the Moruna microkernel serving moruna.driver.block for one NVMe controller's first namespace, one I/O queue pair per CPU, moving data by DMA straight into its clients' memory objects"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
moruna-svc.workspace = true
moruna-mmio = { path = "../mmio", version = "=0.1.0" }
moruna-pci = { path = "../pci", version = "=0.1.0" }
moruna-nvme = { path = "../nvme-core", version = "=0.1.0" }
block-protocol = { path = "../block-protocol", version = "=0.1.0" }
