[package]
name = "moruna-storvsc-server"
description = "The storvsc process: each Hyper-V SCSI controller vmbus opens for it, driven with moruna-storvsc, its disks found and named as Azure names them, each served as moruna.driver.block and registered with the device manager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

# The process itself, for the kernel's user target only: on a host it is an empty program,
# and the library above is what the host tests run.
[[bin]]
name = "storvsc"
path = "src/main.rs"
test = false
bench = false

[dependencies]
moruna-svc.workspace = true
moruna-storvsc = { path = "../core", version = "=0.1.0" }
moruna-vmbus = { path = "../../vmbus/core", version = "=0.1.0" }
vmbus-protocol = { path = "../../vmbus/protocol", version = "=0.1.0" }
block-protocol = { path = "../../block-protocol", version = "=0.1.0" }
devices-protocol = { path = "../../../devices/protocol", version = "=0.1.0" }
# The boot disk's GPT, and its `moruna-system` partition served as a window (item 3.3).
moruna-disk = { path = "../../disk", version = "=0.1.0" }

[target.'cfg(target_os = "none")'.dependencies]
moruna-sys.workspace = true
# The node's console line for a service that cannot go on (system design, section 1B).
moruna-abi.workspace = true
# The channel's two rings over the memory vmbus maps for it, and a safe view of that memory
# as atomic bytes.
vmbus_ring = { path = "../../../vendor/openvmm/vmbus_ring", version = "=0.0.0" }
zerocopy = { version = "=0.8.63", features = ["derive"] }

[dev-dependencies]
# The fake storvsp of moruna-storvsc's own tests (`../core/tests/storvsc/fake.rs`), behind
# moruna-vmbus's in-memory channel, which the server's tests drive the server against.
moruna-vmbus = { path = "../../vmbus/core", version = "=0.1.0", features = ["testing"] }
storvsp_protocol = { path = "../../../vendor/openvmm/storvsp_protocol", version = "=0.0.0" }
scsi_defs = { path = "../../../vendor/openvmm/scsi_defs", version = "=0.0.0" }
vmbus_ring = { path = "../../../vendor/openvmm/vmbus_ring", version = "=0.0.0" }
guestmem_core = { path = "../../../vendor/openvmm/guestmem_core", version = "=0.0.0" }
zerocopy = { version = "=0.8.63", features = ["derive"] }
